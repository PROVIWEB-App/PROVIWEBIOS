name: Build & Distribute PROVIWEB iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build IPA on macOS Runner
    runs-on: macos-14
    env:
      ACTIONS_RUNNER_FORCE_NODE24: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode 16.2
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project PROVIWEB.xcodeproj -scheme PROVIWEB

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project PROVIWEB.xcodeproj \
            -scheme PROVIWEB \
            -configuration Release \
            -archivePath build/PROVIWEB.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PROVIWEB.xcarchive/Products/Applications/PROVIWEB.app build/Payload/
          cd build
          zip -qry PROVIWEB.ipa Payload
          cd ..

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PROVIWEB-IPA
          path: build/PROVIWEB.ipa
          retention-days: 14

      - name: Build for iOS Simulator (Appetize.io)
        run: |
          xcodebuild build \
            -project PROVIWEB.xcodeproj \
            -scheme PROVIWEB \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
          APP_DIR=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -n 1)
          if [ -d "$APP_DIR" ]; then
            cd "$(dirname "$APP_DIR")"
            zip -qry "$GITHUB_WORKSPACE/PROVIWEB-Simulator-Appetize.zip" "$(basename "$APP_DIR")"
            cd "$GITHUB_WORKSPACE"
            echo "✓ PROVIWEB-Simulator-Appetize.zip creado exitosamente en $GITHUB_WORKSPACE"
            ls -lh "$GITHUB_WORKSPACE/PROVIWEB-Simulator-Appetize.zip"
          else
            echo "ERROR: No se encontró .app en build/DerivedData/Build/Products/Debug-iphonesimulator"
            find build/DerivedData -name "*.app"
            exit 1
          fi

      - name: Upload Appetize Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROVIWEB-Simulator-Appetize
          path: PROVIWEB-Simulator-Appetize.zip
          retention-days: 14

      - name: Distribute to Firebase App Distribution
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute build/PROVIWEB.ipa \
            --app 1:475963980955:ios:2441bbe38752b18c8e1a3e \
            --release-notes "PROVIWEB iOS v1.0.0 (Build 1) - Release Beta migrado exitosamente desde Android." \
            --groups "testers,qa-team" \
            --token "$FIREBASE_TOKEN"
